<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="800" height="240" role="img"
    aria-labelledby="titleDesc">
    <title id="titleDesc">ChatApp Logo — Auto Light/Dark (All Purple Text)</title>

    <defs>
        <style>
            /* Default (light mode) */
            .purple { fill: #7C3AED; }
            .dot { fill: #ffffff; }

            .brand, .tag {
            font-family: Inter, system-ui, sans-serif;
            font-weight: 700;
            fill: #7C3AED;
            }
            .tag {
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            }

            /* Dark mode override (slightly lighter purple for better contrast) */
            @media (prefers-color-scheme: dark) {
            .purple { fill: #9F6BFF; }
            .brand, .tag { fill: #9F6BFF; }
            }
        </style>
    </defs>

    <!-- Icon -->
    <g transform="translate(20,40)">
        <rect class="purple" x="0" y="0" width="160" height="120" rx="28" ry="28" />
        <path class="purple" d="M54 120 L80 96 L92 120 Z" />
        <circle class="dot" cx="40" cy="60" r="10" />
        <circle class="dot" cx="80" cy="60" r="10" />
        <circle class="dot" cx="120" cy="60" r="10" />
    </g>

    <!-- Text -->
    <text x="220" y="95" class="brand" font-size="64">ChatApp</text>
    <text x="220" y="145" class="tag" font-size="20">Chat Anywhere</text>
</svg>